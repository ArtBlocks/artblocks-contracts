name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # npm trusted publishing requires Node >= 22.14 and npm >= 11.5.1
          node-version: "24"

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 libusb-1.0-0-dev libudev-dev

      - name: Install Dependencies
        run: |
          corepack enable
          yarn

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          # This expects you to have a script called release which does a build for your packages and calls changeset publish
          publish: yarn release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HASURA_ADMIN_SECRET: ${{ secrets.HASURA_ADMIN_SECRET }}
          HASURA_GRAPHQL_API_ENDPOINT: ${{ secrets.HASURA_GRAPHQL_API_ENDPOINT }}
